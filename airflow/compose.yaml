services:
  webserver:
    image: apache/airflow:3.1.0
    env_file:
      - ../.env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@database:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
    depends_on:
      - database
    ports:
      - "8080:8080"
    command: api-server
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../src:/opt/busbuddy/src
      - ../config:/opt/busbuddy/config
      - ../data:/opt/busbuddy/data
      - ./simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json

  scheduler:
    image: apache/airflow:3.1.0
    working_dir: /opt/busbuddy
    env_file:
      - ../.env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@database:5432/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://webserver:8080/execution/
    depends_on:
      - database
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../src:/opt/busbuddy/src
      - ../config:/opt/busbuddy/config
      - ../data:/opt/busbuddy/data

  database:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

  airflow-init:
    image: apache/airflow:3.1.0
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@database:5432/airflow
    depends_on:
      - database
    command: db migrate

  dag-processor:
    image: apache/airflow:3.1.0
    env_file:
      - ../.env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@database:5432/airflow
    depends_on:
      - database
    command: dag-processor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../src:/opt/busbuddy/src
      - ../config:/opt/busbuddy/config
      - ../data:/opt/busbuddy/data